<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it iOS reports env(safe-area-inset-*) as 0,
         so the tab bar's home-indicator padding never applies on real iPhones.
         interactive-widget=resizes-content: Android Chrome resizes the layout
         when the keyboard opens so inputs in the bottom sheet stay visible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Cuboid Studio</title>
    <meta name="description" content="3D modular logic builder for architectural exploration" />
    <meta name="theme-color" content="#f7f5f0" />

    <!-- Apple iOS meta tags -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cuboid Studio" />

    <!-- model-viewer: AR preview (Scene Viewer / Quick Look) -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
